<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>edit product</title>
  <!--<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">-->
  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/model.js"></script>
  <script defer src="js/controller.js"></script>
</head>
<body>
<button type="button" id="to-table" class="display-flex position-fixed align-items-center justify-content-center circle-button font-size-18 margin-left-10 position-relative red-button">
  <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#ffffff"><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></svg>
</button>
<div class="container display-flex align-items-center justify-content-center flex-wrap">
  <div class="card display-flex align-items-center justify-content-space-around border-radius-10">
    <form class="display-flex flex-direction-column">
      <label for="product_name" class="font-size-18 margin-left-10">Product Name</label>
      <input type="text" name="product_name" id="product_name" placeholder="Enter Product Name" class="regular-input margin-10 padding-5">
      <label for="product_description" class="font-size-18 margin-left-10" >Product Description</label>
      <input type="text" name="product_description" id="product_description" placeholder="Enter Product Description" class="regular-input margin-10 padding-5">
      <label for="product_price" class="font-size-18 margin-left-10">Product Price in hryvnia</label>
      <input type="number" name="product_price" id="product_price" placeholder="Enter Product Price" class="regular-input margin-10 padding-5">
    </form>
    <div class="display-flex align-items-center justify-content-center">
      <button type="button" id="apply-product" class="display-flex align-items-center justify-content-center circle-button font-size-18 green-button">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#ffffff"><path d="M382-240 154-468l57-57 171 171 367-367 57 57-424 424Z"/></svg>
      </button>
      <button type="button" id="clear-form" class="display-flex align-items-center justify-content-center circle-button font-size-18 margin-left-10 red-button">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#ffffff"><path d="M120-280v-80h560v80H120Zm80-160v-80h560v80H200Zm80-160v-80h560v80H280Z"/></svg>
      </button>
    </div>
  </div>
</div>
</body>
</html>
